[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ios-publish"
version = "0.2.0"
description = "Build signed iOS IPAs and install them over your tailnet."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ios-publish = "ios_publish.cli:main"

[tool.setuptools]
package-dir = {"" = "skills/ios-local-publish/scripts"}

[tool.setuptools.packages.find]
where = ["skills/ios-local-publish/scripts"]
include = ["ios_publish*"]

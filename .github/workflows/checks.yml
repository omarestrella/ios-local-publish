name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path skills/ios-local-publish/scripts/Publisher
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-service.mjs
      - run: ./ios-publish --help
      - run: xcodebuild -project apps/ios/Publish.xcodeproj -scheme Publish -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
  skills-install:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-skills-install.mjs
